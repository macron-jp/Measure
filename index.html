<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D WebXR AR Ruler</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }
        #info-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            min-width: 200px;
        }
        #action-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            z-index: 10;
            display: none;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/ARButton.js"></script>
</head>
<body>

    <div id="info-overlay">AR စတင်ရန် အောက်က ခလုတ်ကို နှိပ်ပါ</div>
    <button id="action-btn">အမှတ် မှတ်မည် (Add Point)</button>

    <script>
        let container;
        let camera, scene, renderer;
        let controller;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        let points = [];
        let line = null;
        const infoOverlay = document.getElementById('info-overlay');
        const actionBtn = document.getElementById('action-btn');

        init();
        animate();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            // 1. Scene ပြင်ဆင်ခြင်း
            scene = new THREE.Scene();

            // 2. Camera ပြင်ဆင်ခြင်း
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // 3. Light (အလင်းရောင်) ထည့်ခြင်း
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            // 4. Renderer ပြင်ဆင်ခြင်း
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true; // WebXR ဖွင့်ခြင်း
            container.appendChild(renderer.domElement);

            // 5. WebXR AR Button ထည့်သွင်းခြင်း
            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

            // Target Marker/Reticle (ပြင်ပမျက်နှာပြင်ပေါ် လိုက်ကြည့်ပေးမည့် ဝိုင်းဝိုင်းလေး)
            const geometry = new THREE.RingGeometry(0.02, 0.025, 32).rotateX(-Math.PI / 2);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            reticle = new THREE.Mesh(geometry, material);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // Controller / Touch Event
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            window.addEventListener('resize', onWindowResize);

            // AR Session စတင်ချိန်/ပြီးချိန် ထိန်းချုပ်ခြင်း
            renderer.xr.addEventListener('sessionstart', () => {
                infoOverlay.innerText = "မျက်နှာပြင်ကို ဖုန်းဖြင့် ဖြည်းဖြည်းချင်း စကန်ဖတ်ပါ";
                actionBtn.style.display = "block";
            });

            actionBtn.addEventListener('click', onSelect);
        }

        // စခရင် သို့မဟုတ် ခလုတ် နှိပ်သည့်အခါ အမှတ်မှတ်သားခြင်း
        function onSelect() {
            if (reticle.visible) {
                // Reticle ရှိသည့် 3D နေရာအတိအကျကို ရယူခြင်း
                const position = new THREE.Vector3();
                position.setFromMatrixPosition(reticle.matrix);

                // အမှတ်နေရာမှာ အလုံးအသေးလေး ထည့်ပေးခြင်း
                const sphereGeo = new THREE.SphereGeometry(0.008, 16, 16);
                const sphereMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                sphere.position.copy(position);
                scene.add(sphere);

                points.push(position);

                // အမှတ် ၂ ခု ပြည့်သွားလျှင် မျဉ်းဆွဲပြီး အကွာအဝေး တွက်ခြင်း
                if (points.length === 2) {
                    // မျဉ်းဆွဲခြင်း
                    const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                    const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff00, linewidth: 3 });
                    line = new THREE.Line(lineGeo, lineMat);
                    scene.add(line);

                    // 3D Space တွင် အကွာအဝေးတွက်ချက်ခြင်း (Meter မှ Centimeter သို့)
                    const distanceInMeters = points[0].distanceTo(points[1]);
                    const distanceInCm = (distanceInMeters * 100).toFixed(1);

                    infoOverlay.innerText = `အလျား: ${distanceInCm} cm`;
                    actionBtn.innerText = "ပြန်စရန် (Reset)";
                } else if (points.length > 2) {
                    // ပြန်စရန် ရှင်းလင်းခြင်း
                    resetMeasurement();
                } else {
                    infoOverlay.innerText = "ဒုတိယအမှတ်ကို ရွေးချယ်ပါ";
                }
            }
        }

        function resetMeasurement() {
            // Scene ထဲမှ အမှတ်များနှင့် မျဉ်းများ ဖျက်ခြင်း
            scene.children = scene.children.filter(child => child.type !== "Line" && child.type !== "Mesh" || child === reticle);
            points = [];
            infoOverlay.innerText = "ပထမအမှတ်ကို ရွေးချယ်ပါ";
            actionBtn.innerText = "အမှတ် မှတ်မည် (Add Point)";
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then((referenceSpace) => {
                        session.requestHitTestSource({ space: referenceSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });

                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                        actionBtn.style.display = "none";
                        infoOverlay.innerText = "AR စတင်ရန် အောက်က ခလုတ်ကို နှိပ်ပါ";
                    });

                    hitTestSourceRequested = true;
                }

                // 3D Surface / Hit-test တွေ့ရှိမှု စစ်ဆေးခြင်း
                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);

                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
